name: wallpaper_sync
description: Cross-platform Wallpaper Sync App for macOS, iOS, and Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase & Authentication
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3
  # State Management & Utilities
  provider: ^6.1.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.4
  http: ^1.2.2
  uuid: ^4.5.1
  file_picker: ^8.1.2
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
